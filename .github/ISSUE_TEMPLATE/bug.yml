name: Bug report
description: Report a reproducible GTAR1 problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Exclude secrets, private songbooks, and personal data."
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: GTAR1 version or commit, browser/OS, installed PWA or browser tab, demo or local app.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use minimal sample content you have permission to share.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Sanitized errors, screenshots, frequency, and workaround if available. Remove personal data.
